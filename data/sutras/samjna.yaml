- id: "1.1.8"
  lsk: 9
  lskVerified: true
  sk: 9
  deva: "मुखनासिकावचनोऽनुनासिकः"
  pada: ["मुख-नासिका-वचनः", "अनुनासिकः"]
  anuvrtti: []
  adhikara: []
  vrtti: "मुखसहितनासिकयोच्चार्यमाणो वर्णोऽनुनासिकसंज्ञः स्यात् । तदित्थम् - अ इ उ ऋ एषां वर्णानां प्रत्येकमष्टादश भेदाः । ऌवर्णस्य द्वादश तस्य दीर्घाभावात् । एचामपि द्वादश तेषां ह्रस्वाभावात् ॥"
  vrttiVerified: true
  kind: saṃjñā
  meaning: "A sound produced through the mouth and the nose together is anunāsika (nasal)."
- id: "1.1.9"
  lsk: 10
  lskVerified: true
  sk: 10
  deva: "तुल्यास्यप्रयत्नं सवर्णम्"
  pada: ["तुल्य-आस्य-प्रयत्नम्", "सवर्णम्"]
  anuvrtti: []
  adhikara: []
  vrtti: "ताल्वादिस्थानमाभ्यन्तरप्रयत्नश्चेत्येतद्द्वयं यस्य येन तुल्यं तन्मिथः सवर्णसंज्ञं स्यात्। ऋऌवर्णयोर्मिथः सावर्ण्यं वाच्यम् (वार्त्तिकम्)। अकुहविसर्जनीयानां कण्ठः। इचुयशानां तालु। ऋटुरषाणां मूर्धा। ऌतुलसानां दन्ताः। उपूपध्मानीयानामोष्ठौ। ञमङणनानां नासिका च। एदैतोः कण्ठतालु। ओदौतोः कण्ठोष्ठम्। वकारस्य दन्तोष्ठम्। जिह्वामूलीयस्य जिह्वामूलम्। नासिकाऽनुस्वारस्य। यत्नो द्विधा - आभ्यन्तरो बाह्यश्च। आद्यः पञ्चधा - स्पृष्टेषत्स्पृष्टेषद्विवृतविवृतसंवृतभेदात्। तत्र स्पृष्टं प्रयतनं स्पर्शानाम्। ईषत्स्पृष्टमन्तःस्थानाम्। ईषद्विवृतमूष्मणाम्। विवृतं स्वराणाम्। ह्रस्वस्यावर्णस्य प्रयोगे संवृतम्। प्रक्रियादशायां तु विवृतमेव। बाह्यप्रयत्नस्त्वेकादशधा - विवारः संवारः श्वासो नादो घोषोऽघोषोऽल्पप्राणो महाप्राण उदात्तोऽनुदात्तः स्वरितश्चेति। खरो विवाराः श्वासा अघोषाश्च। हशः संवारा नादा घोषाश्च। वर्गाणां प्रथमतृतीयपञ्चमा यणश्चाल्पप्राणाः। वर्गाणां द्वितीयचतुर्थौ शलश्च महाप्राणाः। कादयो मावसानाः स्पर्शाः। यणोऽन्तःस्थाः। शल ऊष्माणः। अचः स्वराः। ᳵकᳵख इति कखाभ्यां प्रागर्धविसर्गसदृशो जिह्वामूलीयः। ᳶपᳶफ इति पफाभ्यां प्रागर्धविसर्गसदृश उपध्मानीयः। अं अः इत्यचः परावनुस्वारविसर्गौ॥"
  vrttiVerified: true
  kind: saṃjñā
  meaning: "Sounds that share both their place in the mouth and their internal effort are savarṇa — members of one sound-class."
- id: "1.1.69"
  lsk: 11
  lskVerified: true
  sk: 14
  deva: "अणुदित् सवर्णस्य चाप्रत्ययः"
  pada: ["अण्-उदित्", "सवर्णस्य", "च", "अ-प्रत्ययः"]
  anuvrtti: [["स्वम्", "1.1.68"], ["रूपम्", "1.1.68"]]
  adhikara: []
  vrtti: "प्रतीयते विधीयत इति प्रत्ययः। अविधीयमानोऽणुदिच्च सवर्णस्य संज्ञा स्यात्। अत्रैवाण् परेण णकारेण। कु चु टु तु पु एते उदितः। तदेवम् - अ इत्यष्टादशानां संज्ञा। तथेकारोकारौ। ऋकारस्त्रिंशतः। एवम् ऌकारोऽपि। एचो द्वादशानाम्। अनुनासिकाननुनासिकभेदेन यवला द्विधा; तेनाननुनासिकास्ते द्वयोर्द्वयोस्संज्ञा॥"
  vrttiVerified: true
  kind: paribhāṣā
  meaning: "A sound of the aṇ class, or an item marked with u, names its whole savarṇa class as well as itself — unless it is a suffix."
- id: "1.4.109"
  lsk: 12
  lskVerified: true
  sk: 28
  deva: "परः सन्निकर्षः संहिता"
  pada: ["परः", "सन्निकर्षः", "संहिता"]
  anuvrtti: []
  adhikara: [["आकडारात् एका संज्ञा", "1.4.1"]]
  vrtti: "वर्णानामतिशयितः सन्निधिः संहितासंज्ञः स्यात् ॥"

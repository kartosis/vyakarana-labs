- id: "1.2.31"
  lsk: 8
  lskVerified: true
  sk: 7
  deva: "समाहारः स्वरितः"
  pada: ["समाहारः", "स्वरितः"]
  anuvrtti: [["अच्", "1.2.27"]]
  adhikara: []
  vrtti: "स नवविधोऽपि प्रत्येकमनुनासिकत्वाननुनासिकत्वाभ्यां द्विधा ॥"
  vrttiVerified: true
  kind: saṃjñā

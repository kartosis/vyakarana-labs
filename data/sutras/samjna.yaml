- id: "1.3.3"
  lsk: 1
  lskVerified: true
  sk: 1
  deva: "हलन्त्यम्"
  pada: ["हल्", "अन्त्यम्"]
  anuvrtti: [["उपदेशे", "1.3.2"], ["इत्", "1.3.2"]]
  adhikara: []
  vrtti: "उपदेशेऽन्त्यं हलित्स्यात्। उपदेश आद्योच्चारणम्। सूत्रेष्वदृष्टं पदं सूत्रान्तरादनुवर्तनीयं सर्वत्र॥"
  vrttiVerified: true
  kind: saṃjñā
  meaning: "In an item as Pāṇini first teaches it (upadeśa), the final consonant is an it — a marker, not part of the sound-material."
- id: "1.1.60"
  lsk: 2
  lskVerified: true
  sk: 53
  deva: "अदर्शनं लोपः"
  pada: ["अदर्शनं", "लोपः"]
  anuvrtti: [["स्थाने", "1.1.50"]]
  adhikara: []
  vrtti: "प्रसक्तस्यादर्शनं लोपसंज्ञं स्यात्॥"
  vrttiVerified: true
  kind: saṃjñā
  meaning: "The non-appearance of something that would otherwise be present is called lopa."
- id: "1.3.9"
  lsk: 3
  lskVerified: true
  sk: 62
  deva: "तस्य लोपः"
  pada: ["तस्य", "लोपः"]
  anuvrtti: []
  adhikara: []
  vrtti: "तस्येतो लोपः स्यात्। णादयोऽणाद्यर्थाः॥"
  vrttiVerified: true
  kind: vidhi
  meaning: "That it-marker undergoes lopa: it is not heard."
- id: "1.1.71"
  lsk: 4
  lskVerified: true
  sk: 2
  deva: "आदिरन्त्येन सहेता"
  pada: ["आदिः", "अन्त्येन", "सह", "इता"]
  anuvrtti: [["स्वम्", "1.1.68"], ["रूपम्", "1.1.68"]]
  adhikara: []
  vrtti: "अन्त्येनेता सहित आदिर्मध्यगानां स्वस्य च संज्ञा स्यात् । यथाऽणिति अ इ उ वर्णानां संज्ञा। एवमच् हल् अलित्यादयः॥"
  vrttiVerified: true
  kind: saṃjñā
  meaning: "An initial sound, taken together with a final it-marker, names itself and every sound in between."
- id: "1.2.27"
  lsk: 5
  lskVerified: true
  sk: 4
  deva: "ऊकालोऽज्झ्रस्वदीर्घप्लुतः"
  pada: ["ऊ-कालः", "अच्", "ह्रस्व-दीर्घ-प्लुतः"]
  anuvrtti: []
  adhikara: []
  vrtti: "उश्च ऊश्च उ३श्च वः; वां काल इव कालो यस्य सोऽच् क्रमाद् ह्रस्वदीर्घप्लुतसंज्ञः स्यात्। स प्रत्येकमुदात्तादिभेदेन त्रिधा॥"
  vrttiVerified: true
  kind: saṃjñā
  meaning: "A vowel that lasts as long as short u, long ū or prolated u3 is called short (hrasva), long (dīrgha) or prolated (pluta), respectively."

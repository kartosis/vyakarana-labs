# Saṃjñā-prakaraṇa of the Laghusiddhāntakaumudī (LSK 1–14), plus sūtras referenced from it.
# Fields
#   id          Aṣṭādhyāyī number a.p.s (standard numbering)
#   lsk         LSK number, null if not an LSK sūtra here
#   lskVerified true when the LSK number was checked against a source (docs/PROGRESS.md §4.4)
#   deva        sūtra text, Devanagari (public-domain original)
#   pada        padaccheda (word split)
#   anuvrtti    words carried over from earlier sūtras: [word, from]
#   vrtti       LSK vṛtti (Varadarāja); vrttiVerified marks text checked against a source
#   meaning     plain-English rendering (original to this project)
#   kind        saṃjñā | paribhāṣā | vidhi | niyama | atideśa | adhikāra
- id: "1.3.3"
  lsk: 1
  lskVerified: true
  deva: हलन्त्यम्
  pada: [हल्, अन्त्यम्]
  anuvrtti: [[उपदेशे, "1.3.2"], [इत्, "1.3.2"]]
  vrtti: उपदेशेऽन्त्यं हलित्स्यात्। उपदेश आद्योच्चारणम्। सूत्रेष्वदृष्टं पदं सूत्रान्तरादनुवर्तनीयं सर्वत्र॥
  vrttiVerified: true
  kind: saṃjñā
  meaning: In an item as Pāṇini first teaches it (upadeśa), the final consonant is an it — a marker, not part of the sound-material.
- id: "1.1.60"
  lsk: 2
  lskVerified: true
  deva: अदर्शनं लोपः
  pada: [अदर्शनम्, लोपः]
  anuvrtti: []
  vrtti: प्रसक्तस्यादर्शनं लोपसंज्ञं स्यात्।
  vrttiVerified: true
  kind: saṃjñā
  meaning: The non-appearance of something that would otherwise be present is called lopa.
- id: "1.3.9"
  lsk: 3
  lskVerified: true
  deva: तस्य लोपः
  pada: [तस्य, लोपः]
  anuvrtti: [[इतः, "1.3.2"]]
  vrtti: तस्येतो लोपः स्यात्। णादयोऽणाद्यर्थाः।
  vrttiVerified: true
  kind: vidhi
  meaning: That it-marker undergoes lopa. (The vṛtti adds — the markers ṇ and the rest exist to form names like aṇ.)
- id: "1.1.71"
  lsk: 4
  lskVerified: false
  deva: आदिरन्त्येन सहेता
  pada: [आदिः, अन्त्येन, सह, इता]
  anuvrtti: []
  vrttiVerified: false
  kind: saṃjñā
  meaning: An initial sound, taken together with a final it-marker, names itself and every sound in between.
- id: "1.2.27"
  lsk: 5
  lskVerified: true
  deva: ऊकालोऽज्झ्रस्वदीर्घप्लुतः
  pada: [ऊकालः, अच्, ह्रस्वदीर्घप्लुतः]
  anuvrtti: []
  vrtti: उश्च ऊश्च ऊ३श्च वः; वां कालो यस्य सोऽच् क्रमाद् ह्रस्वदीर्घप्लुतसंज्ञः स्यात्। स प्रत्येकमुदात्तादि भेदेन त्रिधा।
  vrttiVerified: true
  kind: saṃjñā
  meaning: A vowel lasting as long as u, ū or ū3 is called short (hrasva), long (dīrgha) or prolated (pluta), respectively.
- id: "1.2.29"
  lsk: 6
  lskVerified: false
  deva: उच्चैरुदात्तः
  pada: [उच्चैः, उदात्तः]
  anuvrtti: [[अच्, "1.2.27"]]
  vrttiVerified: false
  kind: saṃjñā
  meaning: A vowel pronounced high is udātta.
- id: "1.2.30"
  lsk: 7
  lskVerified: false
  deva: नीचैरनुदात्तः
  pada: [नीचैः, अनुदात्तः]
  anuvrtti: [[अच्, "1.2.27"]]
  vrttiVerified: false
  kind: saṃjñā
  meaning: A vowel pronounced low is anudātta.
- id: "1.2.31"
  lsk: 8
  lskVerified: false
  deva: समाहारः स्वरितः
  pada: [समाहारः, स्वरितः]
  anuvrtti: [[अच्, "1.2.27"]]
  vrttiVerified: false
  kind: saṃjñā
  meaning: A vowel that combines the two (high and low) is svarita.
- id: "1.1.8"
  lsk: 9
  lskVerified: false
  deva: मुखनासिकावचनोऽनुनासिकः
  pada: [मुखनासिकावचनः, अनुनासिकः]
  anuvrtti: []
  vrttiVerified: false
  kind: saṃjñā
  meaning: A sound produced through the mouth and the nose together is anunāsika (nasal).
- id: "1.1.9"
  lsk: 10
  lskVerified: true
  deva: तुल्यास्यप्रयत्नं सवर्णम्
  pada: [तुल्यास्यप्रयत्नम्, सवर्णम्]
  anuvrtti: []
  vrtti: ताल्वादिस्थानमाभ्यन्तरप्रयत्नश्चेत्येतद्द्वयं यस्य येन तुल्यं तन्मिथः सवर्णसंज्ञं स्यात्।
  vrttiVerified: true
  kind: saṃjñā
  meaning: Sounds that share both their place in the mouth and their internal effort are savarṇa — members of one sound-class.
- id: "1.1.10"
  lsk: 11
  lskVerified: false
  deva: नाज्झलौ
  pada: [न, अज्झलौ]
  anuvrtti: [[सवर्णम्, "1.1.9"]]
  vrttiVerified: false
  kind: niyama
  meaning: A vowel and a consonant are never savarṇa, even when their place and effort match.
- id: "1.1.69"
  lsk: 12
  lskVerified: false
  deva: अणुदित्सवर्णस्य चाप्रत्ययः
  pada: [अणुदित्, सवर्णस्य, च, अप्रत्ययः]
  anuvrtti: [[स्वं रूपम्, "1.1.68"]]
  vrttiVerified: false
  kind: paribhāṣā
  meaning: A sound of the aṇ class, or an item marked with u, names its whole savarṇa class as well as itself — unless it is a suffix.
- id: "1.1.7"
  lsk: 13
  lskVerified: true
  deva: हलोऽनन्तराः संयोगः
  pada: [हलः, अनन्तराः, संयोगः]
  anuvrtti: []
  vrtti: अज्भिरव्यवहिता हलः संयोगसंज्ञाः स्युः॥
  vrttiVerified: true
  kind: saṃjñā
  meaning: Consonants with no vowel between them are called a saṃyoga (cluster).
- id: "1.4.14"
  lsk: 14
  lskVerified: true
  deva: सुप्तिङन्तं पदम्
  pada: [सुप्तिङन्तम्, पदम्]
  anuvrtti: []
  vrtti: सुबन्तं तिङन्तं च पदसंज्ञं स्यात्॥
  vrttiVerified: true
  kind: saṃjñā
  meaning: What ends in a nominal ending (sup) or a verbal ending (tiṅ) is a pada — a finished, usable word.

# Referenced, not numbered in this prakaraṇa
- id: "1.3.2"
  lsk: null
  lskVerified: false
  deva: उपदेशेऽजनुनासिक इत्
  pada: [उपदेशे, अच्, अनुनासिकः, इत्]
  anuvrtti: []
  vrttiVerified: false
  kind: saṃjñā
  meaning: In an upadeśa, a nasalised vowel is an it-marker.
- id: "1.1.68"
  lsk: null
  lskVerified: false
  deva: स्वं रूपं शब्दस्याशब्दसंज्ञा
  pada: [स्वम्, रूपम्, शब्दस्य, अशब्दसंज्ञा]
  anuvrtti: []
  vrttiVerified: false
  kind: paribhāṣā
  meaning: In grammar a word denotes its own form — unless it is a technical name.
- id: "1.1.52"
  lsk: null
  lskVerified: false
  deva: अलोऽन्त्यस्य
  pada: [अलः, अन्त्यस्य]
  anuvrtti: []
  vrttiVerified: false
  kind: paribhāṣā
  meaning: An operation taught for an item applies to its final sound.

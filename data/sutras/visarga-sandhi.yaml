  deva: "भोभगोअघोअपूर्वस्य योऽशि"
  pada: ["भो-भगो-अघो-अपूर्वस्य", "यः", "अशि"]
  anuvrtti: [["रोः", "8.3.16"]]
  adhikara: [["पदस्य", "8.1.16"], ["पूर्वत्रासिद्धम्", "8.2.1"], ["संहितायाम्", "8.2.108"]]
  vrtti: "एतत्पूर्वस्य रोर्यादेशोऽशि। देवा इह, देवायिह। भोस् भगोस् अघोस् इति सान्ता निपाताः। तेषां रोर्यत्वे कृते॥"
  vrttiVerified: true
  kind: vidhi
  meaning: "After bho, bhago and agho (from bhos, bhagos, aghos), or after a or ā, ru becomes y before a vowel or voiced consonant (aś): devā iha or devāy iha."

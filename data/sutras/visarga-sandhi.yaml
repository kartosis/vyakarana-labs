- id: "6.1.113"
  lsk: 105
  lskVerified: true
  sk: 163
  deva: "अतो रोरप्लुतादप्लुते"
  pada: ["अतः", "रोः", "अप्लुतात्", "अप्लुते"]
  anuvrtti: [["अति", "6.1.109"], ["उत्", "6.1.111"]]
  adhikara: [["संहितायाम्", "6.1.72"]]
  vrtti: "अप्लुतादतः परस्य रोरुः स्यादप्लुतेऽति। शिवोऽर्च्यः॥"
  vrttiVerified: true
  kind: vidhi
  meaning: "After short a, ru becomes u before short a (neither of them pluta): śiva + ru + arcyaḥ → śivo 'rcyaḥ."

- id: "6.3.111"
  lsk: 111
  lskVerified: true
  sk: 174
  deva: "ढ्रलोपे पूर्वस्य दीर्घोऽणः"
  pada: ["ढ्रलोपे", "पूर्वस्य", "दीर्घः", "अणः"]
  anuvrtti: []
  adhikara: [["उत्तरपदे", "6.3.1"]]
  vrtti: "ढरेफयोर्लोपनिमित्तयोः पूर्वस्याणो दीर्घः। पुना रमते। हरी रम्यः। शम्भू राजते। अणः किम्? तृढः। वृढः। मनस् रथ इत्यत्र रुत्वे कृते हशि चेत्युत्वे रोरीति लोपे च प्राप्ते -"
  vrttiVerified: true
  kind: vidhi
  meaning: "When ḍh or r is dropped before ḍh or r, the a, i or u before it becomes long: punā ramate, harī ramyaḥ, śambhū rājate."
- id: "1.4.2"
  lsk: 112
  lskVerified: true
  sk: 175
  deva: "विप्रतिषेधे परं कार्यम्"
  pada: ["विप्रतिषेधे", "परम्", "कार्यम्"]
  anuvrtti: []
  adhikara: [["आकडारात् एका संज्ञा", "1.4.1"]]
  vrtti: "तुल्यबलविरोधे परं कार्यं स्यात्। इति लोपे प्राप्ते। पूर्वत्रासिद्धमिति रोरीत्यस्यासिद्धत्वादुत्वमेव। मनोरथः॥"
  vrttiVerified: true
  kind: paribhāṣā
  meaning: "When two rules of equal strength conflict, the later one in the grammar applies."
- id: "6.1.132"
  lsk: 113
  lskVerified: true
  sk: 176
  deva: "एतत्तदोः सुलोपोऽकोरनञ्समासे हलि"
  pada: ["एतत्-तदोः", "सुलोपः", "अकोः", "अ-नञ्समासे", "हलि"]
  anuvrtti: []
  adhikara: [["संहितायाम्", "6.1.72"]]
  vrtti: "अककारयोरेतत्तदोर्यः सुस्तस्य लोपो हलि न तु नञ्समासे। एष विष्णुः। स शम्भुः। अकोः किम्? एषको रुद्रः। अनञ्समासे किम्? असः शिवः। हलि किम्? एषोऽत्र॥"
  vrttiVerified: true
  kind: vidhi
  meaning: "The nominative ending s of etad and tad (forms without k) is dropped before a consonant, except in a negative compound: eṣa viṣṇuḥ, sa śambhuḥ."
- id: "6.1.134"
  lsk: 114
  lskVerified: true
  sk: 177
  deva: "सोऽचि लोपे चेत् पादपूरणम्"
  pada: ["सः", "अचि", "लोपे", "चेत्", "पादपूरणम्"]
  anuvrtti: [["सुलोपः", "6.1.132"]]
  adhikara: [["संहितायाम्", "6.1.72"]]
  vrtti: "स इत्यस्य सोर्लोपः स्यादचि पादश्चेल्लोपे सत्येव पूर्य्येत । सेमामविड्ढि प्रभृतिम् । सैष दाशरथी रामः ॥"
  vrttiVerified: true
  kind: vidhi
  meaning: "The s of saḥ is dropped before a vowel when that is needed to complete a line of verse: saiṣa dāśarathī rāmaḥ."

  adhikara: [["संहितायाम्", "6.1.72"]]
  vrtti: "तथा। शिवो वन्द्यः॥"
  vrttiVerified: true
  kind: vidhi
  meaning: "After short a, ru becomes u before a voiced consonant (haś) as well: śivo vandyaḥ."

cards:
  - id: it.1-3-3
    front: ‹hal antyam› (1.3.3)
    back: In an upadeśa, the final consonant is an it (a marker).
  - id: it.1-1-60
    front: ‹adarśanaṃ lopaḥ› (1.1.60)
    back: Non-appearance of what was due to appear is called lopa.
  - id: it.1-3-9
    front: ‹tasya lopaḥ› (1.3.9)
    back: The it undergoes lopa.
  - id: it.upadesa
    front: ‹upadeśa›
    back: An item as Pāṇini first teaches it (‹ādyoccāraṇam›, "the first utterance").
items:
  - id: it1
    type: choice
    prompt: In ‹hayavaraṭ›, which sound does 1.3.3 make an it?
    options: [‹ṭ›, ‹ha›, ‹ra›, none of them]
    answer: 0
  - id: it2
    type: choice
    prompt: Where do the words "in an upadeśa" and "is an it" in 1.3.3 come from?
    options: [carried over from 1.3.2, written in the sūtra itself, from 1.1.1, from the Mahābhāṣya]
    answer: 0
  - id: it3
    type: choice
    prompt: ‹lopa› means…
    options: [non-appearance, destruction, doubling, lengthening]
    answer: 0
  - id: it4
    type: choice
    prompt: Why does 1.3.9 say ‹tasya›, "of that"?
    options:
      - So the whole marker disappears, not only its last sound.
      - To make the rule optional.
      - To refer to the previous lesson.
      - Because every sūtra needs a pronoun.
    answer: 0
    explain: The Kāśikā says ‹tasya› is there for complete deletion; otherwise 1.1.52 would delete only the final sound.
  - id: it5
    type: choice
    prompt: After lopa, can Pāṇini still use a marker?
    options:
      - Yes, as a name-tag, as in ‹aṭ›.
      - No, it is destroyed.
      - Only in the Veda.
      - Only in suffixes.
    answer: 0
  - id: it6
    type: choice
    prompt: What is an upadeśa?
    options: [an item as Pāṇini first teaches it, any word of Sanskrit, a commentary, a long vowel]
    answer: 0

cards:
  - id: samhita.1-4-109
    front: ‹paraḥ sannikarṣaḥ saṃhitā› (1.4.109)
    back: The utmost nearness of sounds — spoken with no pause — is called saṃhitā, the condition for sandhi.
  - id: sam.1-1-7
    front: ‹halo 'nantarāḥ saṃyogaḥ› (1.1.7)
    back: Consonants with no vowel between them form a saṃyoga.
  - id: pada.1-4-14
    front: ‹suptiṅantaṃ padam› (1.4.14)
    back: What ends in a sup or a tiṅ ending is a pada, a usable word.
  - id: sam.guru
    front: A short vowel before a saṃyoga
    back: counts as heavy (‹guru›), by 1.4.11
items:
  - id: sam1
    type: choice
    prompt: In ‹agni›, the saṃyoga is…
    options: [‹gn›, ‹ag›, ‹ni›, there is none]
    answer: 0
  - id: sam2
    type: choice
    prompt: Is the bare stem ‹rāma› a pada?
    options:
      - "No: it has no ending yet."
      - "Yes"

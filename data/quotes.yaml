  work: Vākyapadīya
  ref: Vākyakāṇḍa 2.38 (verse numbering of the ashtadhyayi.com text)
  deva: उपादायापि ये हेयास्तानुपायान्प्रचक्षते । उपायानां च नियमो नावश्यं अवतिष्ठते ॥
  translation: What is taken up only to be let go again is called a means. And among means, no single fixed rule need hold.

- id: kas-6.1.109
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 6.1.109
  deva: एङ् यः पदान्तस्तस्मादति परतः पूर्वपरयोः स्थाने पूर्वरूपमेकादेशो भवति। अग्नेऽत्र। वायोऽत्र। अयवादेशयोरयमपवादः।
  translation: When short a follows an e or o that ends a word, the earlier sound's form replaces both — agne 'tra, vāyo 'tra. This sets aside the substitutes ay and av.

- id: vp-2.238
  author: Bhartṛhari
  work: Vākyapadīya
  ref: Vākyakāṇḍa 2.238 (verse numbering of the ashtadhyayi.com text)
  deva: उपायाः शिक्षमाणानां बालानां उपलापनाः । असत्ये वर्त्मनि स्थित्वा ततः सत्यं समीहते ॥
  translation: The devices of teaching are ways of coaxing children who are learning. Standing first on a path that is not real, one then reaches for the real.

- id: vp-2.188
  author: Bhartṛhari
  work: Vākyapadīya
  ref: Vākyakāṇḍa 2.188 (verse numbering of the ashtadhyayi.com text)
  deva: स वाचको विशेषाणां संभवाद्द्योतकोऽपि वा । शक्त्याधानाय वा धातोः सहकारी प्रयुज्यते ॥
  translation: The prefix either expresses particular meanings itself; or, since those meanings are already possible in the root, it only brings them to light; or it is used as a helper that lends the root a new power.

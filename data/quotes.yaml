- id: vp-1.77
  author: Bhartṛhari
  work: Vākyapadīya
  ref: Brahmakāṇḍa 1.77 (verse numbering of the ashtadhyayi.com text)
  deva: स्वभावभेदान्नित्यत्वे ह्रस्वदीर्घप्लुतादिषु । प्राकृतस्य ध्वनेः कालः शब्दस्येत्युपचर्यते ॥
  translation: Since the word itself is eternal, in short, long and prolated vowels it is the duration of the primary sound, which differs by its own nature, that is figuratively ascribed to the word.

  work: Kāśikāvṛtti
  ref: on 6.1.88
  deva: अवर्णात् परो य एच्, एचि च पूर्वो योऽवर्णः, तयोः पूर्वपरयोरवर्णैचोः स्थाने वृद्धिरेकादेशो भवति। आद्गुणस्यापवादः।
  translation: An e, ai, o or au after a or ā, and the a or ā before it — in place of both comes a single vṛddhi vowel. This rule sets aside ād guṇaḥ (6.1.87).

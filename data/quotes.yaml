- id: kas-6.1.101-vt
  author: Kātyāyana, cited in the Kāśikāvṛtti
  work: Kāśikāvṛtti
  ref: on 6.1.101
  deva: सवर्णदीर्घत्व ऋति ऋ वा वचनम्॥ ऋति सवर्णे परभूते तत्र ऋ वा भवतीति वक्तव्यम्। होतृ ऋकारो होतृकारः।
  translation: "On lengthening like vowels, a statement is needed: before ṛ the result may also be ṛ. That is, when a like ṛ follows, ṛ may come instead — hotṛ ṛkāraḥ becomes hotṛkāraḥ."
  verified: true

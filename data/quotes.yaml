- id: kas-1.1.9-prayatna
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 1.1.9
  deva: चत्वार आभ्यन्तराः प्रयत्नाः सवर्णसंज्ञायामाश्रीयन्ते — स्पृष्टता, ईषत्स्पृष्टता, संवृतता, विवृतता चेति।
  translation: Four internal efforts are taken into account for the term savarṇa — full contact, slight contact, closure and openness.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/kashika.txt
- id: sk-samhita
  author: Bhaṭṭoji Dīkṣita
  work: Siddhāntakaumudī
  ref: under 8.4.18, citing a traditional verse
  deva: संहितैकपदे नित्या नित्या धातूपसर्गयोः । नित्या समासे वाक्ये तु सा विवक्षामपेक्षते ॥
  translation: Saṃhitā is required within a single word, required between a root and its prefix, required in a compound; in a sentence, it depends on what the speaker intends.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/kaumudi.txt
- id: vp-2.58
  author: Bhartṛhari
  work: Vākyapadīya
  ref: Vākyakāṇḍa 2.58 (verse numbering of the ashtadhyayi.com text)
  deva: पदप्रकृतिभावश्च वृत्तिभेदेन वर्ण्यते । पदानां संहिता योनिः संहिता वा पदाश्रया ॥
  translation: Which is the base is described differently by different schools. Either the continuous text (saṃhitā) is the source of the separate words, or the continuous text rests on the words.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/vakyapadeeyam/data.txt
- id: vp-1.73
  author: Bhartṛhari
  work: Vākyapadīya
  ref: 1.73 (Brahmakāṇḍa)
  deva: पदे न वर्णा विद्यन्ते वर्णेष्ववयवा न च । वाक्यात् पदानामत्यन्तं प्रविवेको न कश्चन ॥
  translation: There are no sounds within the word, and no parts within the sounds. Words have no absolute separation from the sentence.
  verified: true
  checkedAt: https://qbz506-vakya-vallari.static.hf.space/kanda-1.html
- id: vp-2.104
  author: Bhartṛhari
  work: Vākyapadīya
  ref: Vākyakāṇḍa 2.104 (verse numbering of the ashtadhyayi.com text)
  deva: संहिताविषये वर्णाः स्वरूपेणाविकारिणः । शब्दान्तरत्वं यान्तीव शक्त्यन्तरपरिग्रहात् ॥
  translation: Where sounds are joined (saṃhitā), they do not change in their own nature. They only seem to become other sounds, because they take on a different capacity.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/vakyapadeeyam/data.txt
- id: mbh-1.1.1-mangala
  author: Patañjali
  work: Mahābhāṣya
  ref: on 1.1.1
  deva: कथं वृद्धिरादैज् इति । एतदेकमाचार्यस्य मङ्गलार्थं मृष्यताम् । माङ्गलिक आचार्यो महतः शास्त्रौघस्य मङ्गलार्थं वृद्धिशब्दमादितः प्रयुङ्क्ते । मङ्गलादीनि हि शास्त्राणि प्रथन्ते वीरपुरुषकाणि भवन्त्यायुष्मत्पुरुषकाणि चाध्येतारश्च वृद्धियुक्ता यथा स्युरिति । सर्वत्रैव हि व्याकरणे पूर्वोच्चारिता संज्ञी, परोच्चारिता संज्ञा अदेङ् गुण इति यथा ॥
  translation: "Then how can he say vṛddhir ādaic? Let this one case be pardoned: it is for the sake of good fortune. The teacher cares about good beginnings, and puts the word vṛddhi, ‘growth’, at the head of his great flood of teaching. For sciences that begin auspiciously spread far and have heroic and long-lived men among them, and he wants those who study it to be blessed with growth. Everywhere else in grammar, what is named is stated first and its name after it, as in adeṅ guṇaḥ."
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/bhashya.txt
- id: mbh-1.1.50
  author: Patañjali
  work: Mahābhāṣya
  ref: on 1.1.50
  deva: किमुदाहरणम् ? इको यणचि। दध्यत्र। मध्वत्र। तालुस्थानस्य तालुस्थानः। ओष्ठस्थानस्य ओष्ठस्थानो यथा स्यादिति। नैतदस्ति। सङ्ख्यातानुदेशेनाप्येतत् सिद्धम्।
  translation: "What is an example of this rule? iko yaṇ aci: dadhy atra, madhv atra — so that a palatal replaces a palatal and a labial replaces a labial. — That does not hold: this much already follows from pairing in order (1.3.10)."
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/bhashya.txt
- id: kas-1.1.66
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 1.1.66
  deva: तस्मिन्निति सप्तम्यर्थनिर्देशे पूर्वस्यैव कार्यं भवति, नोत्तरस्य। इको यणचि — दध्युदकम्। मध्विदम्। पचत्योदनम्। निर्दिष्टग्रहणमानन्तर्यार्थम्। अग्निचिदत्रेति व्यवहितस्य मा भूत्॥
  translation: When something is named in the locative, the operation applies to what comes before it, not after it. For iko yaṇ aci — dadhy udakam, madhv idam, pacaty odanam. The word nirdiṣṭe ("named") requires the two to be adjacent, so that the rule does not reach across a sound, as in agnicid atra.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/kashika.txt
- id: kas-6.1.77
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 6.1.77
  deva: अचि परत इको यणादेशो भवति। दध्यत्र। मध्वत्र। कर्त्रर्थम्। हर्त्रर्थम्। लाकृतिः॥
  translation: When a vowel follows, an ik vowel is replaced by a yaṇ sound — dadhyatra, madhvatra, kartrartham, hartrartham, lākṛtiḥ.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/kashika.txt
- id: kas-6.1.78
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 6.1.78
  deva: एचः स्थानेऽचि परतोऽय् अव् आय् आव् इत्येत आदेशा यथासंख्यं भवन्ति। चयनम्। लवनम्। चायकः। लावकः।
  translation: In place of e, o, ai and au, when a vowel follows, the substitutes ay, av, āy and āv come in order — cayanam, lavanam, cāyakaḥ, lāvakaḥ.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/kashika.txt
- id: kas-6.1.87
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 6.1.87
  deva: अवर्णात् परो योऽच् अचि च पूर्वो योऽवर्णः, तयोः पूर्वपरयोरवर्णाचोः स्थान एको गुण आदेशो भवति। तवेदम्। खट्वेन्द्रः। मालेन्द्रः। तवेहते। खट्वेहते। तवोदकम्। खट्वोदकम्। तवर्श्यः। खट्वर्श्यः। तवल्कारः। खट्वल्कारः।
  translation: A vowel after a or ā, and the a or ā before it — in place of both, earlier and later, comes a single guṇa vowel. tavedam, khaṭvendraḥ, mālendraḥ, tavehate, khaṭvehate, tavodakam, khaṭvodakam, tavarśyaḥ, khaṭvarśyaḥ, tavalkāraḥ, khaṭvalkāraḥ.
  verified: true
  checkedAt: https://github.com/ashtadhyayi-com/data/blob/master/sutraani/kashika.txt
- id: kas-1.1.51
  author: Jayāditya & Vāmana
  work: Kāśikāvṛtti
  ref: on 1.1.51
  deva: उः स्थानेऽण् प्रसज्यमान एव रपरो वेदितव्यः। कर्ता। हर्ता। किरति। गिरति।
  translation: An aṇ vowel coming in place of ṛ is to be understood as followed by r from the very moment it applies — kartā, hartā, kirati, girati.

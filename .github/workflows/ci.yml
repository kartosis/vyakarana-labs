name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every run step gets `bash --noprofile --norc -eo pipefail` (GitHub's implicit shell has no pipefail, so
# `terraform plan | tee plan.txt` could never fail — review #16). Checked by scripts/check-workflows.mjs (W1).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Engine tests and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workflow policy (pipefail everywhere, Lambda built before plan, deploy only after green CI)
        run: node scripts/check-workflows.mjs
      - name: Engine — type check
        run: pnpm --filter @vl/engine check
      - name: Engine — tests
        run: pnpm --filter @vl/engine test
      - name: CloudFront function — tests
        run: node --test infra/terraform/modules/site/rewrite.test.mjs
      - name: vidyut-prakriya WebAssembly (derivation stepper)
        uses: ./.github/actions/vidyut
      - name: Site — build (validates content schemas, sūtra references, MDX)
        run: pnpm --filter @vl/web build
      - name: Site — type check (islands, lib, content config; uses types generated by the build)
        run: pnpm --filter @vl/web typecheck
      - name: Site — lessons of modules not yet open are not published (external review #13)
        run: node apps/web/scripts/check-published.mjs
      - name: CSP — inline hashes fit CloudFront's header limit
        run: node scripts/csp-hashes.mjs apps/web/dist /tmp/csp.json
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: vidyut-wasm
          path: apps/web/public/vidyut
          retention-days: 30

  e2e:
    name: Browser tests (accessibility, CSP, account flows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/vidyut
      - run: pnpm --filter @vl/web build
      - run: node scripts/csp-hashes.mjs apps/web/dist /tmp/csp.json
      - run: pnpm --filter @vl/web exec playwright install --with-deps chromium
      - name: Serve the built site
        working-directory: apps/web
        run: |
          nohup pnpm exec astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - name: axe (WCAG 2.2 AA rules), every page type, light and dark
        working-directory: apps/web
        run: node e2e/a11y.cjs
      - name: Account flows with stubbed Cognito and API, production CSP enforced
        working-directory: apps/web
        run: node e2e/accounts.cjs /tmp/csp.json
      - name: Account edge cases from the external review (#5, #6, #18, deletion errors), production CSP enforced
        working-directory: apps/web
        run: node e2e/accounts-edge.cjs /tmp/csp.json
      - name: Saving practice and reviews exactly once (review #1, #9) — outbox, retries, reload, production CSP enforced
        working-directory: apps/web
        run: node e2e/integrity.cjs /tmp/csp.json
      - name: Cookieless analytics beacon (review #19) — absent without a token; with one, on every page and CSP-clean
        working-directory: apps/web
        env:
          PUBLIC_CF_BEACON_TOKEN: 0123456789abcdef0123456789abcdef # test value, not a real token
        run: |
          npx astro build --outDir /tmp/dist-beacon
          node e2e/beacon.cjs dist /tmp/dist-beacon "$PUBLIC_CF_BEACON_TOKEN"
      - name: Derivation tool (vidyut-prakriyā WebAssembly), production CSP enforced
        working-directory: apps/web
        run: node e2e/prakriya.cjs /tmp/csp.json

  api:
    name: API lint, types and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the owner develops on Windows (external review #15, time-zone data)
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Types (mypy --strict)
        run: uv run mypy src
      - run: uv run pytest -q
      - name: Package (arm64, python3.13)
        if: runner.os == 'Linux'
        run: ./build.sh

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"
      - name: Format (advisory — lists files as a warning annotation)
        run: |
          files=$(terraform fmt -check -recursive -list=true infra/terraform || true)
          if [ -n "$files" ]; then echo "::warning title=terraform fmt::run 'terraform fmt -recursive infra/terraform' — $(echo $files | tr '\n' ' ')"; fi
      - name: Shell has pipefail (a failing command piped into tee must fail the step)
        run: |
          [[ -o pipefail ]] || { echo "::error title=pipefail::run steps do not have pipefail"; exit 1; }
          if (false | tee /dev/null); then echo "::error title=pipefail::false | tee succeeded"; exit 1; fi
      - uses: astral-sh/setup-uv@v6
      - name: IAM policy checks (no self-escalation, boundary required, plan role read-only; review #2, #3)
        run: uv run --no-project --with python-hcl2==7.3.1 --with pytest==8.4.2 pytest -q -p no:cacheprovider infra/terraform/tests
      - name: Validate bootstrap
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
      - name: Validate prod
        run: |
          terraform -chdir=infra/terraform/envs/prod init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/prod validate

  plan:
    name: Terraform plan (pull requests)
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE != ''
    needs: [terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_cf_beacon_token: ${{ vars.CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v6
      - name: Build the Lambda package the plan reads (review #17)
        working-directory: services/api
        run: ./build.sh
      - name: Terraform plan
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo '### Terraform plan'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

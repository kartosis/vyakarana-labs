name: deploy

# Deploys only a commit whose `ci` run on main finished green, and deploys exactly that commit
# (external review: deploy gating). A manual run re-checks CI for the commit it is given.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # read the ci run for the commit
  id-token: write # OIDC → AWS, no stored keys

defaults:
  run:
    shell: bash # -eo pipefail (review #16)

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    name: Deploy only a green, current commit of main
    # Stays dormant until the bootstrap outputs are saved as repository variables.
    if: >-
      vars.AWS_DEPLOY_ROLE != '' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        name: Green ci on main for this commit, and still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch main --commit "$SHA" --event push \
                --json conclusion -q 'map(.conclusion) | first // "none"')
          if [ "$c" != success ]; then echo "::error title=deploy gate::ci for $SHA on main is '$c', not success"; exit 1; fi
          # Re-running an old green ci run must not roll production back (P1 exit review X10).
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice title=deploy gate::$SHA is no longer the tip of main ($tip); its own ci run deploys it"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy to AWS
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The deploy role trusts only jobs in this environment; restrict the environment to `main`
    # (Settings → Environments → prod → Deployment branches, DEPLOY.md §4): P1 exit review X5.
    environment:
      name: prod
      url: ${{ steps.urls.outputs.site_url }}
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_cf_beacon_token: ${{ vars.CF_BEACON_TOKEN }}
      TF_DIR: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vl/engine test
      - uses: astral-sh/setup-uv@v7
      - name: API — test and package
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run pytest -q
          ./build.sh
      - name: vidyut-prakriya WebAssembly (derivation stepper)
        uses: ./.github/actions/vidyut
      - name: Build site
        run: pnpm --filter @vl/web build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sanskrit.identifyragas.com' }}
          # same variable as TF_VAR_cf_beacon_token: the beacon tag and the CSP that allows it switch together
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "<2.0.0"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=$TF_DIR init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: CSP hashes (current build + previous deploy, so cached pages keep working)
        run: |
          BUCKET=$(terraform -chdir=$TF_DIR output -raw site_bucket 2>/dev/null || true)
          if [ -n "$BUCKET" ]; then aws s3 cp "s3://$BUCKET/_meta/csp-current.json" /tmp/csp-prev.json || true; fi
          node scripts/csp-hashes.mjs apps/web/dist $TF_DIR/csp.auto.tfvars.json --merge /tmp/csp-prev.json

      - name: Terraform apply
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve

      - name: Upload site
        run: |
          BUCKET=$(terraform -chdir=$TF_DIR output -raw site_bucket)
          # Hashed assets: cache for a year. Old ones are kept so cached HTML can still load them.
          aws s3 sync apps/web/dist/_astro "s3://$BUCKET/_astro" --cache-control "public,max-age=31536000,immutable"
          # Everything else: short cache, delete pages that no longer exist.
          terraform -chdir=$TF_DIR output -json web_config > apps/web/dist/config.json
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete --exclude "_astro/*" --exclude "_meta/*" --exclude "config.json" \
            --cache-control "public,max-age=300,must-revalidate"
          aws s3 cp apps/web/dist/config.json "s3://$BUCKET/config.json" --cache-control "public,max-age=60" --content-type application/json
          aws s3 cp $TF_DIR/csp.auto.tfvars.current.json "s3://$BUCKET/_meta/csp-current.json" \
            --cache-control "no-store" --content-type application/json

      - name: Invalidate CDN
        run: |
          DIST=$(terraform -chdir=$TF_DIR output -raw distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" --query Invalidation.Id --output text

      - name: Summary
        id: urls
        run: |
          URL=$(terraform -chdir=$TF_DIR output -raw site_url)
          echo "site_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo "- Site: $URL"
            echo "- CloudFront domain (CNAME target): $(terraform -chdir=$TF_DIR output -raw cname_target)"
          } >> "$GITHUB_STEP_SUMMARY"
